<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
#gc{position:relative;width:100vw;height:100vh;overflow:hidden;background:#1a1a1a;cursor:none}
canvas{display:block;image-rendering:pixelated}
#hud{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}

/* TOP BAR */
#topbar{position:absolute;top:0;left:0;right:0;height:38px;background:linear-gradient(180deg,rgba(0,0,0,0.85) 0%,transparent 100%);display:flex;align-items:center;justify-content:space-between;padding:0 10px;pointer-events:none}
#money{color:#00ff88;font-size:15px;font-weight:bold;text-shadow:0 0 8px rgba(0,255,136,0.5)}
#rep-bar{color:#aaa;font-size:9px}
#wp-bar{display:flex;gap:3px;align-items:center}
.wstar{font-size:15px;color:#333}.wstar.on{color:#FFD700}

/* BOTTOM BAR */
#botbar{position:absolute;bottom:0;left:0;right:0;height:34px;background:linear-gradient(0deg,rgba(0,0,0,0.85) 0%,transparent 100%);display:flex;align-items:center;justify-content:space-between;padding:0 10px;pointer-events:none}
#bars{display:flex;gap:10px;align-items:center}
.bl{color:#ccc;font-size:8px;margin-right:3px}
.bw{width:80px;height:6px;background:#333;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.bf{height:100%;border-radius:3px;transition:width 0.2s}
#whud{display:flex;gap:3px}
.ws{padding:2px 5px;border-radius:3px;border:1px solid #444;color:#666;font-size:8px}
.ws.on{border-color:#FFD700;color:#FFD700;background:rgba(255,215,0,0.1)}

/* NOTIFICATIONS */
#notif{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.92);color:#FFD700;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:bold;text-align:center;opacity:0;transition:opacity 0.3s;pointer-events:none;border:1px solid rgba(255,215,0,0.4);max-width:280px;white-space:nowrap;z-index:20}
#mhud{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:5px 12px;border-radius:5px;font-size:10px;text-align:center;border-left:3px solid #FFD700;display:none;max-width:220px;white-space:nowrap}
#kf{position:absolute;top:10px;right:10px;text-align:right;font-size:9px;color:#ff6666;line-height:1.8;pointer-events:none}
#interior-overlay{position:absolute;top:42px;left:50%;transform:translateX(-50%);background:rgba(20,10,5,0.85);color:#FFD700;padding:2px 10px;border-radius:4px;font-size:9px;display:none;pointer-events:none;white-space:nowrap}
#crosshair-info{position:absolute;pointer-events:none;color:#fff;font-size:8px;background:rgba(0,0,0,0.7);padding:2px 6px;border-radius:3px;display:none}
#mm{position:absolute;bottom:38px;right:10px;width:72px;height:72px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,0.2)}

/* TOUCH CONTROLS */
#touch-controls{position:absolute;bottom:38px;left:0;right:0;pointer-events:none;height:calc(100% - 76px)}

/* Left joystick */
#joystick-zone{position:absolute;bottom:10px;left:10px;width:130px;height:130px;pointer-events:auto}
#joystick-base{position:absolute;bottom:0;left:0;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2)}
#joystick-knob{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.3);border:2px solid rgba(255,255,255,0.5);top:33px;left:33px;transition:none}

/* Right action buttons */
#btns-right{position:absolute;bottom:10px;right:90px;width:160px;height:130px;pointer-events:auto}
.abtn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#fff;pointer-events:auto;user-select:none;border:2px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.5);transition:background 0.1s}
.abtn:active{background:rgba(255,255,255,0.2)}
#btn-shoot{width:52px;height:52px;right:0;bottom:38px;background:rgba(220,30,30,0.6);border-color:#ff4444;font-size:18px}
#btn-enter{width:44px;height:44px;right:58px;bottom:0;background:rgba(0,180,100,0.5);border-color:#00ff88;font-size:10px;text-align:center;line-height:1.2}
#btn-action{width:44px;height:44px;right:0;bottom:0;background:rgba(255,200,0,0.5);border-color:#FFD700;font-size:10px;text-align:center;line-height:1.2}
#btn-car{width:44px;height:44px;right:58px;bottom:52px;background:rgba(50,100,200,0.5);border-color:#6699ff;font-size:10px;text-align:center;line-height:1.2}
#btn-dodge{width:40px;height:40px;right:108px;bottom:40px;background:rgba(100,200,255,0.4);border-color:#88ccff;font-size:10px}

/* Top weapon buttons */
#btns-weapons{position:absolute;top:42px;left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}
.wbtn{width:36px;height:28px;border-radius:5px;border:1px solid #444;color:#666;font-size:8px;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.wbtn.on{border-color:#FFD700;color:#FFD700;background:rgba(255,215,0,0.12)}

/* Dialog */
#dlg{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:90vw;max-width:380px;background:rgba(0,0,0,0.95);border:1px solid #FFD700;border-radius:8px;padding:10px 12px;color:#fff;font-size:11px;line-height:1.5;display:none;pointer-events:auto;z-index:30}
#dlg-name{color:#FFD700;font-weight:bold;font-size:12px;margin-bottom:4px}
#dlg-btns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.dbtn{background:#FFD700;color:#000;border:none;padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:monospace;pointer-events:auto}
.dbtn:active{background:#ffee44}

/* Level up */
#lvup{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;flex-direction:column;color:#FFD700;pointer-events:none;z-index:40}
#lvup h2{font-size:24px;letter-spacing:3px}
#lvup p{font-size:12px;color:#fff;margin-top:7px}

/* Zone rep */
#rzones{position:absolute;bottom:38px;right:86px;font-size:8px;color:#777;text-align:right;line-height:1.9;pointer-events:none}
</style>
</head>

function solidB(nx, ny, hw, hh) {
  for (const b of bldgs) {
    if (b.iswater || b.ispark) continue;
    if (nx + hw > b.x && nx - hw < b.x + b.w && ny + hh > b.y && ny - hh < b.y + b.h) return true;
  }
  return false;
}
function solidI(nx, ny, hw, hh) {
  if (!currentInterior) return false;
  const iw = currentInterior.w, ih = currentInterior.h;
  if (nx - hw < 10 || nx + hw > iw - 10 || ny - hh < 10 || ny + hh > ih - 10) return true;
  for (const f of currentInterior.furniture) {
    if (nx + hw > f.x && nx - hw < f.x + f.w && ny + hh > f.y && ny - hh < f.y + f.h) return true;
  }
  return false;
}
function addPart(x, y, col, n, sz, sp = 3) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * sp, vy: (Math.random() - .5) * sp, life: 1, col, sz: sz * (.5 + Math.random() * .7) });
}
function addBlood(x, y) { addPart(x, y, '#c0392b', 8, 3, 4); }
function addExpl(x, y, r = 80) {
  explosions.push({ x, y, r, life: 1 });
  addPart(x, y, '#f39c12', 20, 5, 7); addPart(x, y, '#e74c3c', 14, 4, 6); addPart(x, y, '#fff', 6, 3, 5);

  const targets = inInterior ? interiorState[currentInterior.ek || currentInterior.enterKey || ''].npcs : streetNpcs;
  targets.forEach(n => { if (n.alive && Math.hypot(n.x - x, n.y - y) < r) hitNpc(n, WEAPONS[4].dmg); });
  policeCars.forEach(pc => { if (Math.hypot(pc.x - x, pc.y - y) < r) { pc.hp -= 60; if (pc.hp <= 0) killPC(pc); } });
  if (Math.hypot(player.x - x, player.y - y) < r * .7) takeDmg(30);
  increaseW(2);
}

function playerShoot() {
  const w = WEAPONS[activeWeapon];
  if (weaponCd > 0) return;
  const wx = player.x + Math.cos(player.ang) * 200;
  const wy = player.y + Math.sin(player.ang) * 200;
  if (!w.proj) {
    const range = w.range * (1 + level * .05);
    const targets = inInterior && currentInterior ? interiorState[currentInterior.ek].npcs : streetNpcs;
    let hit = false;
    for (const n of targets) { if (n.alive && Math.hypot(n.x - player.x, n.y - player.y) < range && Math.abs(Math.atan2(n.y - player.y, n.x - player.x) - player.ang) < 1.2) { hitNpc(n, w.dmg); hit = true; break; } }
    if (!hit && !inInterior) for (const pc of policeCars) { if (Math.hypot(pc.x - player.x, pc.y - player.y) < range) { pc.hp -= w.dmg; if (pc.hp <= 0) killPC(pc); increaseW(.5); break; } }
    addPart(player.x + Math.cos(player.ang) * 22, player.y + Math.sin(player.ang) * 22, w.col, 6, 2, 4);
    weaponCd = w.rate;
  } else {
    if (ammo[activeWeapon] <= 0) { nt('Fără muniție! Apasă RELOAD', 1500); return; }
    const shots = activeWeapon === 3 ? 2 : 1;
    for (let i = 0; i < shots; i++) {
      const spread = (Math.random() - .5) * .12;
      bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.ang + spread) * w.spd, vy: Math.sin(player.ang + spread) * w.spd, isPlayer: true, dmg: w.dmg * (1 + level * .08), range: w.range, dist: 0, wep: w, isInterior: inInterior });
    }
    ammo[activeWeapon] = Math.max(0, ammo[activeWeapon] - 1);
    weaponCd = w.rate;
    addPart(player.x + Math.cos(player.ang) * 15, player.y + Math.sin(player.ang) * 15, '#FFD700', 4, 2, 5);
    updateAmmoUI();
  }
}

// ── UPDATES ───────────────────────────────────────────────────────────────────
function updatePlayer() {
  if (player.blinkT > 0) { player.blinkT--; player.visible = player.blinkT % 4 < 2; } else player.visible = true;
  if (weaponCd > 0) weaponCd--;

  // Apply joystick
  const jdx = joystick.dx, jdy = joystick.dy;
  const mag = Math.hypot(jdx, jdy);

  if (player.inCar && player.car) {
    const car = player.car;
    if (mag > 0.15) {
      // Forward/back from vertical axis
      const fwd = -jdy; // negative Y = forward
      if (fwd > 0.1) car.spd = Math.min(car.spd + car.acc * fwd, car.maxSpd * (1 + level * .04));
      else if (fwd < -0.1) car.spd = Math.max(car.spd - car.acc * 1.5 * (-fwd), -car.maxSpd * .4);
      else car.spd *= car.fri;
      // Steering from horizontal axis
      if (Math.abs(jdx) > 0.15 && Math.abs(car.spd) > 0.3) car.ang += jdx * 0.055 * Math.sign(car.spd);
    } else { car.spd *= car.fri; }
    const nx = car.x + Math.cos(car.ang) * car.spd, ny = car.y + Math.sin(car.ang) * car.spd;
    if (!solidB(nx, ny, car.w / 2 + 2, car.h / 2 + 2) && nx > 0 && nx < MW && ny > 0 && ny < MH) { car.x = nx; car.y = ny; } else car.spd *= -.2;
    player.x = car.x; player.y = car.y; player.ang = car.ang;
  } else {
    const spd = 3 * (1 + level * .04);
    if (mag > 0.15) {
      const nx = player.x + jdx * spd, ny = player.y + jdy * spd;
      const ok = inInterior ? !solidI(nx, ny, 10, 10) : !solidB(nx, ny, 10, 10) && nx > 0 && nx < MW && ny > 0 && ny < MH;
      if (ok) { player.x = nx; player.y = ny; }
      player.ang = Math.atan2(jdy, jdx);
    }
  }

  // Auto-aim toward nearest enemy when shooting
  if (touchShoot) {
    const targets = inInterior && currentInterior ? interiorState[currentInterior.ek].npcs.filter(n => n.alive) : streetNpcs.filter(n => n.alive);
    let nearestDist = 320, nearest = null;
    targets.forEach(n => { const d = Math.hypot(n.x - player.x, n.y - player.y); if (d < nearestDist) { nearestDist = d; nearest = n; } });
    if (!nearest && !inInterior) policeCars.forEach(pc => { const d = Math.hypot(pc.x - player.x, pc.y - player.y); if (d < nearestDist) { nearestDist = d; nearest = pc; } });
    if (nearest) player.ang = Math.atan2(nearest.y - player.y, nearest.x - player.x);
    playerShoot();
    touchShoot = false;
  }

  // Handle pickups
  const plist = inInterior && currentInterior ? interiorState[currentInterior.ek].pickups : streetPickups;
  plist.forEach(p => {
    if (!p.active) return;
    if (Math.hypot(p.x - player.x, p.y - player.y) < 22) {
      p.active = false;
      if (p.t === 'health') { hp = Math.min(100, hp + 40); updateBars(); nt('+40 HP 💊', 1500); }
      else if (p.t === 'armor') { armor = Math.min(100, armor + 50); updateBars(); nt('+50 Armură 🛡', 1500); }
      else if (p.t === 'money') { gainMoney(p.v || 200); nt('+$' + (p.v || 200) + ' 💰', 1500); }
      else if (p.t === 'ammo') { ammo[p.wep] = Math.min(maxAmmo[p.wep], ammo[p.wep] + Math.floor(maxAmmo[p.wep] / 2)); nt('Muniție ' + WEAPONS[p.wep].name, 1000); updateAmmoUI(); }
      else if (p.t === 'weapon') { ammo[p.wep] = maxAmmo[p.wep]; nt('Armă: ' + WEAPONS[p.wep].name + '!', 2000); updateAmmoUI(); }
      addPart(p.x, p.y, '#FFD700', 10, 2, 3);
      if (!inInterior) setTimeout(() => { p.active = true; }, 25000);
    }
  });

  // Interior NPC interaction
  if (inInterior && currentInterior) {
    const istate = interiorState[currentInterior.ek];
    for (const n of istate.npcs) {
      if (n.alive && Math.hypot(n.x - player.x, n.y - player.y) < 50) {
        if (n.heals) { hp = Math.min(100, hp + 50); armor = Math.min(100, armor + 20); updateBars(); nt('+50 HP +20 Armură de la ' + n.name, 2000); addPart(player.x, player.y, '#2ecc71', 15, 2, 4); n.hp = 0; n.alive = false; break; }
        if (n.shop) { gainMoney(-300); ammo[2] = maxAmmo[2]; ammo[3] = maxAmmo[3]; nt('Cumpărături! -$300. Muniție refăcută.', 2000); updateAmmoUI(); n.hp = 0; n.alive = false; break; }
      }
    }
    if (activeMission && (activeMission.type === 'rob_bank' || activeMission.type === 'assault')) {
      const hostile = istate.npcs.filter(n => n.hostile);
      if (hostile.length > 0 && hostile.every(n => !n.alive)) completeMission();
    }
  }

  if (!inInterior && activeMission && missionTarget && Math.hypot(missionTarget.x - player.x, missionTarget.y - player.y) < 80) {
    if (activeMission.type === 'delivery' || activeMission.type === 'taxi') completeMission();
  }

  comboT = Math.max(0, comboT - 1); if (comboT <= 0) combo = 0;
}

function updateNPCAI() {
  if (inInterior && currentInterior) {
    const istate = interiorState[currentInterior.ek];
    istate.npcs.forEach(n => {
      if (!n.alive) return;
      const dist = Math.hypot(n.x - player.x, n.y - player.y);
      if (n.hostile && dist < 300) {
        const a = Math.atan2(player.y - n.y, player.x - n.x);
        const nx2 = n.x + Math.cos(a) * 1.5, ny2 = n.y + Math.sin(a) * 1.5;
        if (!solidI(nx2, ny2, 10, 10)) { n.x = nx2; n.y = ny2; }
        n.shootCd = (n.shootCd || 0) - 1;
        if (dist < 260 && n.shootCd <= 0) { bullets.push({ x: n.x, y: n.y, vx: Math.cos(a + (Math.random() - .5) * .2) * 8, vy: Math.sin(a + (Math.random() - .5) * .2) * 8, isPlayer: false, dmg: 10, range: 260, dist: 0, wep: WEAPONS[2], isInterior: true }); n.shootCd = 50; }
      }
    });
    return;
  }
  streetNpcs.forEach(n => {
    if (!n.alive) return;
    const dist = Math.hypot(n.x - player.x, n.y - player.y);
    const hostile = n.faction === 'rivali' || (activeMission && activeMission.type === 'gang_war' && activeMission.npc && n.faction !== activeMission.npc.faction && n.faction !== 'civili');
    if (hostile && dist < 300) {
      const a = Math.atan2(player.y - n.y, player.x - n.x);
      const nx2 = n.x + Math.cos(a) * 1.7, ny2 = n.y + Math.sin(a) * 1.7;
      if (!solidB(nx2, ny2, 10, 10)) { n.x = nx2; n.y = ny2; }
      n.sCd = (n.sCd || 0) - 1;
      if (dist < 280 && n.sCd <= 0) { bullets.push({ x: n.x, y: n.y, vx: Math.cos(a + (Math.random() - .5) * .18) * 8, vy: Math.sin(a + (Math.random() - .5) * .18) * 8, isPlayer: false, dmg: 8, range: 270, dist: 0, wep: WEAPONS[2], isInterior: false }); n.sCd = 55; }
    } else if (dist > 60) {
      n.walkP += .015 * n.pd;
      const nx2 = n.x + Math.cos(n.walkP) * 1.1, ny2 = n.y + Math.sin(n.walkP * .7) * .8;
      if (!solidB(nx2, ny2, 10, 10) && nx2 > 0 && nx2 < MW && ny2 > 0 && ny2 < MH) { n.x = nx2; n.y = ny2; } else n.pd *= -1;
    }
  });
}

function updatePolice() {
  policeTimer++; if (policeTimer > 160 && wanted >= 1 && !inInterior) { spawnPolice(); policeTimer = 0; }
  wantedDecay++; if (wantedDecay > 350 && wanted > 0) { wanted = Math.max(0, wanted - .1); updateWUI(); wantedDecay = 0; }
  if (wanted < .5 && policeCars.length > 0) policeCars.splice(0, 1);
  if (inInterior) return;
  policeCars.forEach(pc => {
    const dist = Math.hypot(pc.x - player.x, pc.y - player.y);
    const ta = Math.atan2(player.y - pc.y, player.x - pc.x);
    let da = ta - pc.ang; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
    pc.ang += Math.sign(da) * Math.min(Math.abs(da), .08);
    pc.spd = Math.min(4.5 + wanted * .3, dist * .05 + 1);
    const nx = pc.x + Math.cos(pc.ang) * pc.spd, ny = pc.y + Math.sin(pc.ang) * pc.spd;
    if (!solidB(nx, ny, pc.w / 2 + 2, pc.h / 2 + 2)) { pc.x = nx; pc.y = ny; } else pc.spd *= -.2;
    pc.blinkP = (pc.blinkP || 0) + 1; pc.shootTimer = (pc.shootTimer || 0) + 1;
    if (dist < 300 && pc.shootTimer > 40) { bullets.push({ x: pc.x, y: pc.y, vx: Math.cos(pc.ang + (Math.random() - .5) * .2) * (8 + wanted), vy: Math.sin(pc.ang + (Math.random() - .5) * .2) * (8 + wanted), isPlayer: false, dmg: 8 + wanted * 2, range: 280, dist: 0, wep: WEAPONS[2], isInterior: false }); pc.shootTimer = 0; }
    if (dist < 25) { takeDmg(2); increaseW(.2); }
  });
}

function updateBullets() {
  bullets = bullets.filter(b => {
    b.x += b.vx; b.y += b.vy; b.dist += Math.hypot(b.vx, b.vy);
    if (b.dist > b.range) return false;
    if (b.isInterior !== inInterior) return true;
    if (inInterior && currentInterior && solidI(b.x, b.y, 3, 3)) { addPart(b.x, b.y, '#aaa', 2, 1, 2); return false; }
    if (!inInterior && solidB(b.x, b.y, 3, 3)) { addPart(b.x, b.y, '#aaa', 3, 1.5, 2); return false; }
    if (b.isPlayer) {
      const targets = inInterior && currentInterior ? interiorState[currentInterior.ek].npcs : streetNpcs;
      for (const n of targets) { if (n.alive && Math.hypot(n.x - b.x, n.y - b.y) < 14) { hitNpc(n, b.dmg); if (b.wep && b.wep.expl) addExpl(b.x, b.y); return false; } }
      if (!inInterior) for (const pc of policeCars) { if (Math.hypot(pc.x - b.x, pc.y - b.y) < 18) { pc.hp -= b.dmg; if (pc.hp <= 0) killPC(pc); increaseW(.3); if (b.wep && b.wep.expl) addExpl(b.x, b.y); return false; } }
      if (!inInterior) for (const c of trafficCars) { if (c.alive && Math.hypot(c.x - b.x, c.y - b.y) < 18) { c.hp -= b.dmg; if (c.hp <= 0) { addExpl(c.x, c.y, 60); c.alive = false; } return false; } }
    } else {
      if (Math.hypot(player.x - b.x, player.y - b.y) < 12) { takeDmg(b.dmg); addPart(b.x, b.y, '#e74c3c', 5, 2, 3); return false; }
    }
    return true;
  });
}

function updateTraffic() { trafficCars.forEach(c => { if (!c.alive) return; c.x += c.vx; c.y += c.vy; if (c.x < 0 || c.x > MW) c.vx *= -1; if (c.y < 0 || c.y > MH) c.vy *= -1; }); }
function updateMissionTimer() {
  if (!activeMission || !missionTimer) return;
  missionTimer -= 1 / 60;
  const mh = document.getElementById('mhud');
  if (mh.style.display !== 'none') mh.innerHTML = '<strong>' + activeMission.text + '</strong><br><span style="color:' + (missionTimer < 15 ? '#e74c3c' : '#FFD700') + '">' + Math.ceil(missionTimer) + 's</span>';

}
function updateParticles() { particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vx *= .9; p.vy *= .9; p.life *= .87; return p.life > .05; }); }
function updateCamera() {
  if (inInterior && currentInterior) {

    cam.x = Math.max(0, Math.min(iw - W(), player.x - W() / 2));

  const sx = 72 / MW, sy = 72 / MH;
  roads.forEach(r => { mx.fillStyle = '#555'; mx.fillRect(r.x * sx, r.y * sy, r.w * sx, r.h * sy); });
  bldgs.forEach(b => { if (!b.iswater && !b.ispark) { mx.fillStyle = 'rgba(100,80,60,.7)'; mx.fillRect(b.x * sx, b.y * sy, b.w * sx, b.h * sy); } });
  streetNpcs.forEach(n => { if (n.alive) { mx.fillStyle = n.color || '#e67e22'; mx.fillRect(n.x * sx - 1.5, n.y * sy - 1.5, 3, 3); } });
  policeCars.forEach(pc => { mx.fillStyle = '#3333ff'; mx.fillRect(pc.x * sx - 2, pc.y * sy - 2, 4, 4); });
  if (missionTarget) { mx.fillStyle = '#FFD700'; mx.beginPath(); mx.arc(missionTarget.x * sx, missionTarget.y * sy, 4, 0, Math.PI * 2); mx.fill(); }
  mx.fillStyle = '#fff'; mx.beginPath(); mx.arc(player.x * sx, player.y * sy, 3.5, 0, Math.PI * 2); mx.fill();
}
function drawCombo() {
  if (combo > 2 && comboT > 0) {
    cx.save(); cx.globalAlpha = comboT / 90;
    cx.fillStyle = '#FFD700'; cx.font = 'bold ' + (12 + combo * 1.2) + 'px monospace';
    cx.textAlign = 'center'; cx.fillText('COMBO x' + combo + '!', W() / 2, H() / 2 - 55);
    cx.restore(); cx.textAlign = 'left';
  }
}
function updateCrosshair() {
  crosshairTarget = null;
  const targets = inInterior && currentInterior ? interiorState[currentInterior.ek].npcs.filter(n => n.alive) : streetNpcs.filter(n => n.alive);
  const tx = player.x + Math.cos(player.ang) * 80, ty = player.y + Math.sin(player.ang) * 80;
  let best = 60;
  targets.forEach(n => { const d = Math.hypot(n.x - tx, n.y - ty); if (d < best) { best = d; crosshairTarget = n; } });
  if (!crosshairTarget && !inInterior) policeCars.forEach(pc => { const d = Math.hypot(pc.x - tx, pc.y - ty); if (d < best) { best = d; crosshairTarget = pc; } });
}

// ── TOUCH INPUT ───────────────────────────────────────────────────────────────
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
const jbRect = () => joystickBase.getBoundingClientRect();

document.addEventListener('touchstart', e => {
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t => {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const jz = document.getElementById('joystick-zone');
    const jzR = jz.getBoundingClientRect();
    if (t.clientX >= jzR.left && t.clientX <= jzR.right && t.clientY >= jzR.top && t.clientY <= jzR.bottom) {
      joystick.active = true; joystick.id = t.identifier;
      joystick.cx = t.clientX; joystick.cy = t.clientY;
    }
  });
}, { passive: false });

document.addEventListener('touchmove', e => {
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t => {
    if (t.identifier === joystick.id) {
      const dx = t.clientX - joystick.cx, dy = t.clientY - joystick.cy;
      const mag = Math.hypot(dx, dy);
      const maxR = 42;
      const nx = mag > maxR ? (dx / mag) * maxR : dx;
      const ny = mag > maxR ? (dy / mag) * maxR : dy;
      joystick.dx = nx / maxR; joystick.dy = ny / maxR;
      joystickKnob.style.left = (33 + nx) + 'px'; joystickKnob.style.top = (33 + ny) + 'px';
    }
  });
}, { passive: false });

document.addEventListener('touchend', e => {
  Array.from(e.changedTouches).forEach(t => {
    if (t.identifier === joystick.id) {
      joystick.active = false; joystick.id = null; joystick.dx = 0; joystick.dy = 0;
      joystickKnob.style.left = '33px'; joystickKnob.style.top = '33px';
    }
  });
});

// Button bindings
function setupBtn(id, ondown, onup) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', e => { e.stopPropagation(); e.preventDefault(); if (ondown) ondown(); }, { passive: false });
  el.addEventListener('touchend', e => { e.stopPropagation(); e.preventDefault(); if (onup) onup(); }, { passive: false });
  el.addEventListener('click', e => { e.stopPropagation(); if (ondown) ondown(); });
}

// Continuous shoot: hold
let shootInterval = null;
setupBtn('btn-shoot',
  () => { touchShoot = true; shootInterval = setInterval(() => { touchShoot = true; }, 120); },
  () => { clearInterval(shootInterval); shootInterval = null; }
);

setupBtn('btn-enter', () => {
  if (inInterior) { exitBuilding(); return; }
  if (player.inCar && player.car) {
    if (Math.abs(player.car.spd) < 1.2) { player.inCar = false; player.car.inUse = false; player.x = player.car.x + Math.cos(player.car.ang + Math.PI / 2) * 26; player.y = player.car.y + Math.sin(player.car.ang + Math.PI / 2) * 26; player.car = null; nt('Ai ieșit din mașină'); }
    return;
  }
  for (const car of playerCars) { if (!car.inUse && Math.hypot(car.x - player.x, car.y - player.y) < 55) { player.inCar = true; player.car = car; car.inUse = true; nt('Ai intrat în ' + car.n + '!'); return; } }
  for (const b of bldgs) { if (Math.hypot((b.x + b.w / 2) - player.x, (b.y + b.h) - player.y) < 72 && b.ek) { enterBuilding(b); return; } }
  nt('Apropie-te de o mașină sau clădire', 1800);
});

setupBtn('btn-action', () => {
  if (dialogActive) { closeDialog(); return; }
  for (const n of streetNpcs) { if (n.alive && Math.hypot(n.x - player.x, n.y - player.y) < 60) { openDialog(n); return; } }
  if (activeMission && missionTarget && Math.hypot(missionTarget.x - player.x, missionTarget.y - player.y) < 80) { completeMission(); return; }
  nt('Apropie-te de un NPC (⭐ galben)', 1500);
});

setupBtn('btn-car', () => {
  if (player.inCar) {
    if (Math.abs(player.car.spd) < 1.2) { player.inCar = false; player.car.inUse = false; player.x = player.car.x + Math.cos(player.car.ang + Math.PI / 2) * 26; player.y = player.car.y + Math.sin(player.car.ang + Math.PI / 2) * 26; player.car = null; nt('Ai ieșit din mașină'); }
  } else {
    for (const car of playerCars) { if (!car.inUse && Math.hypot(car.x - player.x, car.y - player.y) < 55) { player.inCar = true; player.car = car; car.inUse = true; nt('Ai intrat în ' + car.n + '!'); return; } }
    nt('Nicio mașină aproape', 1500);
  }
});

setupBtn('btn-dodge', () => { addPart(player.x, player.y, '#88ccff', 12, 2, 5); nt('Evaziune!', 800); });

// Weapon buttons
for (let i = 0; i < 5; i++) {
  const wb = document.getElementById('wb' + i);
  if (wb) wb.addEventListener('click', e => { e.stopPropagation(); if (ammo[i] > 0 || i === 0) { activeWeapon = i; updateAmmoUI(); } else nt('Fără muniție!', 1000); });
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
let lastT = 0;
function loop(ts) {
  const dt = ts - lastT; lastT = ts; gameTime++;
  cx.clearRect(0, 0, W(), H());
  updatePlayer(); updateNPCAI(); updatePolice(); updateTraffic();
  updateBullets(); updateMissionTimer(); updateParticles(); updateCamera(); updateCrosshair();
  killfeed = killfeed.filter(k => { k.t--; return k.t > 0; });
  if (killfeed.length) document.getElementById('kf').innerHTML = killfeed.slice(-3).map(k => `<div style="opacity:${k.t / 180}">${k.msg}</div>`).join('');
  drawTerrain(); drawPickups(); drawMissionTarget();
  if (!inInterior) { trafficCars.filter(c => c.alive).forEach(c => drawCar(c, false, false)); policeCars.forEach(pc => drawCar(pc, false, true)); playerCars.forEach(c => drawCar(c, c === player.car, false)); }
  drawNPCs(); drawBullets(); drawExplosions(); drawParticles(); drawPlayer(); drawCrosshair(); drawCombo(); drawMinimap();
  cx.fillStyle = 'rgba(255,255,255,0.35)'; cx.font = '8px monospace';
  cx.fillText('Nv.' + level + ' XP:' + Math.floor(xp) + '/' + level * 200 + (inInterior ? '  [INT]' : ''), 8, H() - 4);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
